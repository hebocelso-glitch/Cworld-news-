<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cnews</title>

    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="main-header">
        <button id="menu"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M9 6l6 6-6 6"/>
        </svg></button>
        <h2 class="logo">Cworld</h2>
    </header>

    <!-- Barra de pesquisa -->
    <header class="user-aba">
      <form action='/' method='GET' class="user-nav">
        
            <img class="user" src="{{url_for('static',filename='imagens/me.jpg')}}" alt="Usuário">

            <a href="pesquisar.html">
        <input
              id="pesquisa"
                type="text"
                name="q"
                value="{{pesquisa}}"
                placeholder="Pesquisar notícias..."
            ></a>
          <a class="notificacao" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 8a6 6 0 1 1 12 0v5l2 3H4l2-3V8"/>
  <path d="M10 20a2 2 0 0 0 4 0"/>
</svg></a>
        
      </form>
    </header>

    <!-- Menu lateral -->
    <aside id="sidebar">

        <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 10.5L12 3l9 7.5"/>
  <path d="M5 9.5V21h14V9.5"/>
  <path d="M9 21v-6h6v6"/>
        </svg>
          início</a>
        <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/>
  <path d="M12 8v8"/>
  <path d="M8 12h8"/>
        </svg>
           Criar</a>
        <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/>
  <path d="M2 12h20"/>
  <path d="M12 2a15 15 0 0 1 0 20"/>
  <path d="M12 2a15 15 0 0 0 0 20"/>
        </svg>
           Mundo</a>
        <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/>
  <circle cx="12" cy="10" r="2.5"/>
        </svg>
           Local</a>
      <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 10h18"/>
  <path d="M5 10v8"/>
  <path d="M9 10v8"/>
  <path d="M15 10v8"/>
  <path d="M19 10v8"/>
  <path d="M3 18h18"/>
  <path d="M2 22h20"/>
  <path d="M12 2L2 8h20L12 2z"/>
      </svg> Parlamento</a>
        <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="7" y="7" width="10" height="10" rx="2"/>
  <path d="M9 1v4M15 1v4M9 19v4M15 19v4"/>
  <path d="M1 9h4M1 15h4M19 9h4M19 15h4"/>
        </svg>
          
           Tecnologia</a>
        <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/>
  <polygon points="12,7 9.5,9 10.5,12 13.5,12 14.5,9"/>
  <path d="M12 2v2M4.9 5.1l1.4 1.4M2 12h2M4.9 18.9l1.4-1.4M12 22v-2M19.1 18.9l-1.4-1.4M22 12h-2M19.1 5.1l-1.4 1.4"/>
        </svg>
           Esportes</a>
        <a href="#">
         <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M7 10h10a4 4 0 0 1 3.8 5.3l-1 3A2 2 0 0 1 18 20h-2l-3-3H11l-3 3H6a2 2 0 0 1-1.8-1.7l-1-3A4 4 0 0 1 7 10z"/>
  <path d="M8 13v4"/>
  <path d="M6 15h4"/>
  <circle cx="16.5" cy="14.5" r="0.8"/>
  <circle cx="18.5" cy="16.5" r="0.8"/>
</svg> Jogos</a>
        <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 7h16v13H4z"/>
  <path d="M4 7l3-4"/>
  <path d="M9 7l3-4"/>
  <path d="M14 7l3-4"/>
  <path d="M19 7l1-2"/>
  <path d="M4 11h16"/>
        </svg>
          Entretenimento</a>
      <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/>
  <path d="M12 10v6"/>
  <circle cx="12" cy="7" r="1"/>
      </svg> Sobre</a>

    </aside>

    <main id="feed">

        <!-- Card 1 -->
      {% for noticia in noticias %}
        <div class="card">

            <h2>{{noticia.title}}</h2>

            <img
                class="noticia"
                src={{noticia.image}}
                alt="Notícia"
            >

            <p>
                {{noticia.description}}
            </p>

            <div class="card-actions">

                <button class="action-btn like-btn">

                    <svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">

                        <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
                    </svg>

                    <span>Curtir</span>

                </button>

                <button class="action-btn">

                    <svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">

                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                    </svg>

                    <span>Comentar</span>

                </button>

                <button class="action-btn">

                    <svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">

                        <circle cx="18" cy="5" r="3"/>
                        <circle cx="6" cy="12" r="3"/>
                        <circle cx="18" cy="19" r="3"/>

                        <line x1="8.59" y1="13.51"
                              x2="15.42" y2="17.49"/>

                        <line x1="15.41" y1="6.51"
                              x2="8.59" y2="10.49"/>

                    </svg>

                    <span>Compartilhar</span>

                </button>

            </div>

        </div>
{% endfor %}

    </main>

    <!-- Barra inferior -->
    <nav class="bottom-nav">

        <a href="#" class="nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 10.5L12 3l9 7.5"/>
  <path d="M5 9.5V21h14V9.5"/>
  <path d="M9 21v-6h6v6"/>
            </svg>
            <span>Início</span>
    </a>

        <a href="#" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10"/>
  <path d="M12 8v8"/>
  <path d="M8 12h8"/>
            </svg>
            <span>Criar</span>
        </a>

        <a href="#" class="nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/>
  <circle cx="12" cy="10" r="2.5"/>
            </svg>
            <span>Local</span>
        </a>

    </nav>

    <script src="{{url_for('static',filename='script.js')}}"></script>

</body>
</html>
