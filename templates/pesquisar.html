<!DOCTYPE html>
<html>
<head>
      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisar</title>
    <link rel="stylesheet" href="{{url_for('static',filename='pesq.css')}}">
</head>
<body>

    <form class="busca" method="GET">
        <input
            id="pesquisa"
            type="text"
            name="q"
            placeholder="Pesquisar notícias..."
        >
      <button type="submit" onclick="buscar()" class="botao"><svg viewBox="0 0 24 24" fill="currentColor">
  <path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"/>
      </svg></button>
    </form>


  <p class="text">Os resultados aparevem aqui</p>
  
        {% for noticia in noticias %}
        <div class="card">

            <h2>{{noticia.title}}</h2>

            <img
                class="noticia"
                src="{{noticia.image}}"
                alt="Notícia"
            >

            <p>
                {{noticia.description}}
            </p>

            <div class="card-actions">

                <button class="action-btn like-btn">

                    <svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">

                        <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
                    </svg>

                    <span>Curtir</span>

                </button>

                <button class="action-btn">

                    <svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">

                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                    </svg>

                    <span>Comentar</span>

                </button>

                <button class="action-btn">

                    <svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">

                        <circle cx="18" cy="5" r="3"/>
                        <circle cx="6" cy="12" r="3"/>
                        <circle cx="18" cy="19" r="3"/>

                        <line x1="8.59" y1="13.51"
                              x2="15.42" y2="17.49"/>

                        <line x1="15.41" y1="6.51"
                              x2="8.59" y2="10.49"/>

                    </svg>

                    <span>Compartilhar</span>

                </button>

            </div>

        </div>
{% endfor %}

</body>
  <script src="{{ url_for('static', filename='pesq.js') }}"></script>
</html>
